spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/openex
    username: openex
    password: openex_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration