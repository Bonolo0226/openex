spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/openex}
    username: ${DATABASE_USERNAME:openex}
    password: ${DATABASE_PASSWORD:openex_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: "${JWT_SECRET:openex-dev-super-secret-signing-key-change-in-production-1234567890}"
  expiration-ms: 3600000
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
