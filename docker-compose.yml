services:
  postgres:
    image: postgres:16
    container_name: openex-postgres
    environment:
      POSTGRES_USER: openex
      POSTGRES_PASSWORD: openex_dev_password
      POSTGRES_DB: openex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openex"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: openex-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: openex-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openex
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  market-data-service:
    build: ./market-data-service
    container_name: openex-market-data
    ports:
      - "5000:5000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data: